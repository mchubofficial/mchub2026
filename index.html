
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC HUB | Minecraft Clientleri</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090711;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:38px 15px;background:#160d25;border-bottom:2px solid #873bd0}
h1{font-size:44px;color:#bd80ff;margin:0}
header p{color:#ccc}
main{max-width:1000px;margin:45px auto;padding:15px}
h2{color:#bd80ff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.card{background:#191323;border:1px solid #63349a;border-radius:15px;padding:28px;text-align:center}
.card h3{font-size:25px}
.card p{color:#aaa}
.btn{display:block;background:#873bd0;color:white;text-decoration:none;padding:14px;border-radius:9px;margin-top:22px;font-weight:bold}
.btn:hover{background:#a85af2}
footer{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>
<header>
<h1>MC HUB</h1>
<p>Minecraft Java Client Merkezi</p>
</header>

<main>
<h2>Client Listesi</h2>
<div class="cards">

<div class="card">
<h3>Wurst Client</h3>
<p>Minecraft Java</p>
<a class="btn" href="https://www.wurstclient.net/download/" target="_blank" rel="noopener">Client Yükle</a>
</div>

<div class="card">
<h3>Anubis Client</h3>
<p>Minecraft Java</p>
<a class="btn" href="https://www.mediafire.com/file/0t23gxxh0gcr3zm/Anubis+Beta+0.9.9.1.jar/file" target="_blank" rel="noopener">Client Yükle</a>
</div>

<div class="card">
<h3>Leaf Client</h3>
<p>Minecraft Java</p>
<a class="btn" href="https://leafclient.com/download/" target="_blank" rel="noopener">Client Yükle</a>
</div>

</div>
</main>

<footer>MC HUB © 2026</footer>
</body>
</html>
